<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1317" media="(prefers-color-scheme: dark)">
  <title>MaxPV! Mise à jour</title>
  <link rel="icon" href="favicon.ico">
  <link href="app.css?v=__WEBVER__" rel="stylesheet">
</head>

<body>

  <main class="content page-narrow">

    <header class="topbar">
      <div>
        <h1>Mise à jour</h1>
        <p class="sub">MaxPV! <span id="maxpvver">—</span> · site Web <span id="webver">—</span></p>
      </div>
    </header>

    <div class="stack">

      <section class="card">
        <h2 class="card-title">Firmware</h2>
        <p class="hint">
          Sélectionnez le fichier firmware de MaxPV! (<i>MaxPVx.xx_firmware.bin</i>). Le site Web est intégré
          au firmware et la configuration de MaxPV! est conservée.
        </p>
        <div class="form-grid">
          <label class="field full">
            <span>Fichier firmware</span>
            <input type="file" id="firmware" accept=".bin">
          </label>
        </div>
        <div class="bar" aria-hidden="true"><span id="progress"></span></div>
        <div class="metric-sub" id="progress-text">&nbsp;</div>
        <div class="btn-row" style="margin-top: 14px;">
          <button class="btn primary" type="button" id="updatebutton" disabled>Mettre à jour</button>
        </div>
      </section>

      <div id="status"></div>

    </div>

  </main>

  <script src="app.js?v=__WEBVER__"></script>
  <script>

    const $ = (id) => document.getElementById(id);
    let firmwareBytes = null;

    function setStatus(message, kind) {
      const status = $("status");
      status.innerHTML = "";
      if (!message) return;
      const div = document.createElement("div");
      div.className = "banner" + (kind === "warn" ? " warn" : "");
      if (kind === "ok") div.style.cssText = "background: var(--export-soft); color: var(--export);";
      if (kind === "bad") div.style.cssText = "background: var(--import-soft); color: var(--import);";
      div.textContent = message;
      status.appendChild(div);
    }

    function setProgress(percent) {
      $("progress").style.width = percent + "%";
      $("progress-text").textContent = percent > 0 ? percent + " %" : " ";
    }

    async function fillVersion() {
      try {
        $("maxpvver").textContent = MaxPV.demo ? "3.65" : await MaxPV.getText("api/get?versionmaxpv");
        $("webver").textContent = MaxPV.demo ? "3.65" : await MaxPV.getText("api/get?versionweb");
      }
      catch (e) { /* versions affichées au prochain chargement */ }
    }

    // Lecture du fichier et vérification qu'il s'agit bien d'un firmware ESP8266 :
    // une image firmware commence par l'octet 0xE9, une image filesystem non
    $("firmware").addEventListener("change", () => {
      const file = $("firmware").files[0];
      firmwareBytes = null;
      $("updatebutton").disabled = true;
      setProgress(0);
      setStatus("");
      if (!file) return;

      const reader = new FileReader();
      reader.onload = () => {
        const bytes = new Uint8Array(reader.result);
        if ((bytes.length < 1024) || (bytes[0] !== 0xE9)) {
          setStatus("Ce fichier n'est pas un firmware MaxPV!. Seul le fichier firmware (.bin) peut être chargé.", "bad");
          return;
        }
        firmwareBytes = bytes;
        $("updatebutton").disabled = false;
        setStatus("Firmware de " + Math.round(bytes.length / 1024) + " ko prêt à être chargé.");
      };
      reader.readAsArrayBuffer(file);
    });

    // MD5 (RFC 1321) d'un tableau d'octets, utilisé par l'ESP pour vérifier l'intégrité du firmware reçu
    function md5(bytes) {
      const S = [7, 12, 17, 22, 5, 9, 14, 20, 4, 11, 16, 23, 6, 10, 15, 21];
      const K = [];
      const n = bytes.length;
      let i;
      for (i = 0; i < 64; i++) K[i] = Math.floor(Math.abs(Math.sin(i + 1)) * 4294967296) | 0;

      const words = (((n + 8) >> 6) + 1) * 16;
      const W = new Array(words).fill(0);
      for (i = 0; i < n; i++) W[i >> 2] |= bytes[i] << ((i % 4) * 8);
      W[n >> 2] |= 0x80 << ((n % 4) * 8);
      W[words - 2] = (n * 8) | 0;
      W[words - 1] = Math.floor(n / 536870912);

      let a0 = 0x67452301, b0 = 0xefcdab89 | 0, c0 = 0x98badcfe | 0, d0 = 0x10325476;
      for (let blk = 0; blk < words; blk += 16) {
        let A = a0, B = b0, C = c0, D = d0, F, g, s;
        for (i = 0; i < 64; i++) {
          if (i < 16)      { F = (B & C) | (~B & D); g = i; }
          else if (i < 32) { F = (D & B) | (~D & C); g = (5 * i + 1) % 16; }
          else if (i < 48) { F = B ^ C ^ D;          g = (3 * i + 5) % 16; }
          else             { F = C ^ (B | ~D);       g = (7 * i) % 16; }
          F = (F + A + K[i] + W[blk + g]) | 0;
          s = S[(i >> 4) * 4 + (i % 4)];
          A = D; D = C; C = B;
          B = (B + ((F << s) | (F >>> (32 - s)))) | 0;
        }
        a0 = (a0 + A) | 0; b0 = (b0 + B) | 0; c0 = (c0 + C) | 0; d0 = (d0 + D) | 0;
      }

      let hex = "";
      const words4 = [a0, b0, c0, d0];
      for (i = 0; i < 16; i++) hex += ("0" + ((words4[i >> 2] >>> ((i % 4) * 8)) & 0xff).toString(16)).slice(-2);
      return hex;
    }

    $("updatebutton").addEventListener("click", () => {
      if (!firmwareBytes) return;
      if (MaxPV.demo) { MaxPV.toast("Mode démo : pas de mise à jour", "bad"); return; }
      $("updatebutton").disabled = true;
      $("firmware").disabled = true;

      // Le MD5 doit précéder le fichier dans le formulaire pour être connu dès le début de l'envoi
      const form = new FormData();
      form.append("MD5", md5(firmwareBytes));
      form.append("firmware", new Blob([firmwareBytes]), "firmware.bin");

      const xhttp = new XMLHttpRequest();
      xhttp.upload.onprogress = (e) => {
        if (e.lengthComputable) setProgress(Math.round(100 * e.loaded / e.total));
      };
      xhttp.onreadystatechange = function () {
        if (this.readyState !== 4) return;
        if (this.status === 200) {
          setProgress(100);
          setStatus("Mise à jour réussie, MaxPV! redémarre…", "ok");
          waitRestart();
        }
        else {
          setStatus("Echec de la mise à jour : " + (this.responseText || "connexion perdue") + ". Le firmware actuel est conservé.", "bad");
          $("firmware").disabled = false;
          $("updatebutton").disabled = false;
        }
      };
      setStatus("Envoi du firmware, ne pas couper l'alimentation…", "warn");
      xhttp.open("POST", "update", true);
      xhttp.send(form);
    });

    // Attente du redémarrage puis affichage de la nouvelle version
    function waitRestart() {
      setTimeout(() => {
        const xhttp = new XMLHttpRequest();
        xhttp.timeout = 2000;
        xhttp.onreadystatechange = function () {
          if (this.readyState !== 4) return;
          if (this.status === 200) {
            setStatus("MaxPV! a redémarré, version " + this.responseText + ".", "ok");
            fillVersion();
            $("firmware").disabled = false;
          }
          else waitRestart();
        };
        xhttp.open("GET", "api/get?versionmaxpv", true);
        xhttp.send();
      }, 3000);
    }

    fillVersion();

  </script>
</body>

</html>
