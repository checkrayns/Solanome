<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1317" media="(prefers-color-scheme: dark)">
  <title>MaxPV! Journal</title>
  <link rel="icon" href="favicon.ico">
  <link href="app.css?v=__ASSETS__" rel="stylesheet">
</head>

<body>

  <main class="content page-narrow">

    <header class="topbar">
      <div>
        <h1>Journal</h1>
        <p class="sub" id="summary">&nbsp;</p>
      </div>
      <button class="btn" type="button" id="refresh">Actualiser</button>
    </header>

    <p class="lead">
      Derniers événements de MaxPV!, du plus récent au plus ancien. Le journal est conservé en mémoire et repart
      à zéro à chaque redémarrage. Il est aussi disponible en <a href="api/events" target="_blank">JSON</a>
      et publié sur le topic MQTT <code>maxpv/event</code>.
    </p>

    <div class="chips" role="group" aria-label="Filtrer les événements" id="filters">
      <button type="button" data-filter="all" aria-pressed="true">Tous</button>
      <button type="button" data-filter="boost" aria-pressed="false">Boost</button>
      <button type="button" data-filter="ssr" aria-pressed="false">Mode SSR</button>
      <button type="button" data-filter="boot" aria-pressed="false">Démarrages</button>
      <button type="button" data-filter="network" aria-pressed="false">Wifi et MQTT</button>
    </div>

    <section class="card">
      <ul class="list journal" id="events"><li class="empty">Chargement…</li></ul>
    </section>

  </main>

  <script src="app.js?v=__ASSETS__"></script>
  <script>

    const { fmt } = MaxPV;

    // Catégorie, filtre et couleur de la pastille pour chaque type d'événement
    const TYPES = {
      boot:          ["Démarrage", "boot",    "info"],
      reboot:        ["Démarrage", "boot",    "info"],
      boost_on:      ["Boost",     "boost",   "hot"],
      boost_off:     ["Boost",     "boost",   ""],
      boost_refused: ["Boost",     "boost",   "warn"],
      ssr_mode:      ["SSR",       "ssr",     "info"],
      wifi_lost:     ["Wifi",      "network", "bad"],
      wifi_ok:       ["Wifi",      "network", "ok"],
      wifi_watchdog: ["Wifi",      "network", "warn"],
      mqtt_lost:     ["MQTT",      "network", "bad"],
      mqtt_ok:       ["MQTT",      "network", "ok"]
    };

    let journal = null;
    let filter = "all";

    function render() {
      const list = document.getElementById("events");
      list.innerHTML = "";
      if (!journal) return;
      let shown = 0;
      journal.events.forEach((event) => {
        const info = TYPES[event.type] || [event.type, "other", ""];
        if ((filter !== "all") && (info[1] !== filter)) return;
        const li = document.createElement("li");
        const time = document.createElement("time");
        const msg = document.createElement("span");
        const pill = document.createElement("span");
        time.textContent = fmt.eventTime(event);
        pill.className = "pill" + (info[2] ? " " + info[2] : "");
        pill.textContent = info[0];
        msg.className = "msg";
        msg.append(pill, document.createTextNode(event.msg));
        li.append(time, msg);
        list.appendChild(li);
        shown++;
      });
      if (!shown) list.innerHTML = '<li class="empty">Aucun événement</li>';
    }

    async function load() {
      try {
        journal = await MaxPV.getJSON("api/events");
        document.getElementById("summary").textContent =
          journal.events.length + " événement(s) sur " + journal.total + " depuis le démarrage (capacité " + journal.size + ")";
        render();
      }
      catch (e) {
        document.getElementById("summary").textContent = "Journal inaccessible";
      }
    }

    document.getElementById("filters").addEventListener("click", (e) => {
      const button = e.target.closest("button[data-filter]");
      if (!button) return;
      filter = button.dataset.filter;
      document.querySelectorAll("#filters button").forEach((b) => b.setAttribute("aria-pressed", String(b === button)));
      render();
    });

    document.getElementById("refresh").addEventListener("click", load);

    // Le journal n'est relu que lorsqu'un nouvel événement est signalé par /api/status
    let lastEvent = -1;
    MaxPV.onStatus((status) => {
      if (status && status.lastevent !== lastEvent) { lastEvent = status.lastevent; load(); }
    });

  </script>
</body>

</html>
